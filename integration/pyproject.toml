[project]
name = "cvat-labeling-integration"
version = "0.0.1"
description = "CVAT-backed labeling integration (standalone, pre-marketplace incorporation)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.25",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "cvat-sdk==2.80.0",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "openapi-spec-validator>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".cvat-src", "api/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "UP017"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E701", "E702", "E741", "B017"]
"scripts/**" = ["E401", "E402", "E701", "E702", "E731"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "capability: requires a running pinned CVAT stack",
    "contract: offline schema/contract tests",
]
